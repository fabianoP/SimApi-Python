name: fmu-generator

services:
  fmu:
    build:
      context: .
    command:
      - python
      - /home/fmu/code/energy/Scripts/EnergyPlusToFMU.py
      - -d
      - -i
      - /home/fmu/code/Energy+.idd
      - -w
      - /home/fmu/code/USA.epw
      - /home/fmu/code/_fmu-export-variable.idf
    working_dir: /home/fmu/code/energy/test
    volumes:
      - ./volume:/home/fmu/code/energy/test
